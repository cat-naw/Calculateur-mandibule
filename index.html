<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de mandibule</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #e8d2a8;
        color: #3b2818;
    }

    h1 {
        text-align: center;
        font-size: 27px;
        margin: 0 0 25px 0;
        color: #5a321c;
        font-weight: bold;
    }

    .conteneur {
        display: flex;
        gap: 25px;
        max-width: 850px;
        margin: auto;
        align-items: flex-start;
    }

    .tableau {
        flex: 1;
        border: 2px solid #9b7046;
        background: #f3dfb9;
        border-radius: 3px;
        overflow: hidden;
    }

    .ligne {
        display: grid;
        grid-template-columns: 1fr 100px;
        border-bottom: 1px solid #c6a77b;
        min-height: 42px;
        align-items: center;
    }

    .ligne:last-child {
        border-bottom: none;
    }

    .ligne:nth-child(odd) {
        background: #ead2a7;
    }

    .ligne:nth-child(even) {
        background: #f4e2c1;
    }

    .nom-unite {
        padding: 7px 10px;
        font-size: 15px;
    }

    .quantite {
        width: 90px;
        height: 32px;
        margin: auto;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    .droite {
        width: 245px;
    }

    .titre-section {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #5a321c;
    }

    .champ {
        margin-bottom: 18px;
    }

    .label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #5a321c;
    }

    select,
    .champ input[type="number"] {
        width: 100%;
        height: 40px;
        padding: 5px 8px;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    .mode {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .mode label {
        font-size: 16px;
        font-weight: bold;
        color: #5a321c;
    }

    .mode input {
        margin-right: 5px;
    }

    .bouton {
        width: 100%;
        height: 45px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid #315d32;
        border-radius: 4px;
        background: #4f8a52;
        color: white;
    }

    .bouton:hover {
        background: #417544;
    }

    #resultat {
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.6;
        font-weight: bold;
        color: #5a321c;
    }

    @media (max-width: 650px) {

        body {
            padding: 12px;
        }

        .conteneur {
            gap: 12px;
        }

        .droite {
            width: 180px;
        }

        .ligne {
            grid-template-columns: 1fr 70px;
        }

        .quantite {
            width: 62px;
        }

        .nom-unite {
            font-size: 14px;
        }

        .mode label {
            font-size: 14px;
        }

        select,
        .champ input[type="number"] {
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<h1>Calculateur de mandibule</h1>

<div class="conteneur">

    <div class="tableau" id="tableauUnites"></div>

    <div class="droite">

        <div class="titre-section">Type d'alliance</div>

        <div class="champ">
            <select id="alliance">
                <option value="1.10">Alliance guerrier (+10 %)</option>
                <option value="1.05">Neutre (+5 %)</option>
                <option value="1">Autre (aucun bonus)</option>
            </select>
        </div>

        <div class="titre-section">Type de combat</div>

        <div class="mode">
            <label>
                <input
                    type="radio"
                    name="mode"
                    value="attaque"
                    checked
                    onchange="changerMode()">
                Attaque
            </label>

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="defense"
                    onchange="changerMode()">
                Défense
            </label>
        </div>

        <div id="attaqueFields">

            <div class="champ">
                <div class="label">Bonus d'attaque</div>

                <input
                    id="bonusAttaque"
                    type="number"
                    min="0"
                    step="1"
                    value="0">
            </div>

        </div>

        <div id="defenseFields" style="display:none;">

            <div class="champ">
                <div class="label">Unités tuées</div>

                <input
                    id="unitesTues"
                    type="number"
                    min="0"
                    step="1"
                    value="0">
            </div>

            <div class="champ">
                <div class="label">Bonus de défense</div>

                <input
                    id="bonusDefense"
                    type="number"
                    min="0"
                    step="1"
                    value="0">
            </div>

        </div>

        <button class="bouton" onclick="calculer()">
            Calculer
        </button>

        <div id="resultat"></div>

    </div>

</div>


<script>

/* =========================================================
   UNITÉS
   [Nom, Attaque, Défense]

   L'ordre est l'ordre dans lequel les unités
   sont tuées.
========================================================= */

const unites = [

    ["Esclave", 3, 3],
    ["Maître esclave", 6, 4],
    ["Jeune soldate", 8, 7],
    ["Soldate", 11, 10],
    ["Soldate d'élite", 17, 14],
    ["Gardienne", 1, 27],
    ["Gardienne d'élite", 1, 35],
    ["Tirailleuse", 32, 10],
    ["Tirailleuse d'élite", 40, 12],
    ["Jeune légionnaire", 45, 35],
    ["Légionnaire", 60, 45],
    ["Légionnaire d'élite", 65, 50],
    ["Jeune tank", 80, 1],
    ["Tank", 140, 1],
    ["Tank d'élite", 160, 1]

];


/* =========================================================
   CRÉATION DU TABLEAU
========================================================= */

const tableau =
    document.getElementById("tableauUnites");

unites.forEach((unite, index) => {

    const ligne =
        document.createElement("div");

    ligne.className = "ligne";

    const nom =
        document.createElement("div");

    nom.className = "nom-unite";
    nom.textContent = unite[0];

    const input =
        document.createElement("input");

    input.className = "quantite";
    input.type = "number";
    input.min = "0";
    input.step = "1";
    input.value = "0";
    input.id = "unite-" + index;

    ligne.appendChild(nom);
    ligne.appendChild(input);

    tableau.appendChild(ligne);
});


/* =========================================================
   CHANGEMENT ATTAQUE / DÉFENSE
========================================================= */

function changerMode() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;

    document.getElementById(
        "attaqueFields"
    ).style.display =
        mode === "attaque"
        ? "block"
        : "none";

    document.getElementById(
        "defenseFields"
    ).style.display =
        mode === "defense"
        ? "block"
        : "none";

    document.getElementById(
        "resultat"
    ).innerHTML = "";
}


/* =========================================================
   RÉCUPÉRATION DES QUANTITÉS
========================================================= */

function getQuantites() {

    return unites.map((unite, index) => {

        return Number(
            document.getElementById(
                "unite-" + index
            ).value
        ) || 0;

    });
}


/* =========================================================
   CALCUL PRINCIPAL
========================================================= */

function calculer() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;

    if (mode === "attaque") {

        calculerAttaque();

    } else {

        calculerDefense();

    }
}


/* =========================================================
   TROUVER LA MANDIBULE
=========================================================

   La formule utilisée est :

   Bonus = FDF × (1,05^niveau × alliance - 1)

   On teste les niveaux entiers de 0 à 250
   et on retient celui dont le bonus calculé
   est le plus proche du bonus fourni.
========================================================= */

function trouverMandibule(
    base,
    bonusObserve,
    alliance
) {

    let meilleurNiveau = 0;
    let meilleureErreur = Infinity;

    for (
        let niveau = 0;
        niveau <= 250;
        niveau++
    ) {

        const coefficientMandibule =
            Math.pow(1.05, niveau);

        const coefficientTotal =
            coefficientMandibule * alliance;

        const bonusTheorique =
            base *
            (coefficientTotal - 1);

        const erreur =
            Math.abs(
                bonusTheorique -
                bonusObserve
            );

        if (erreur < meilleureErreur) {

            meilleureErreur = erreur;
            meilleurNiveau = niveau;

        }
    }

    return meilleurNiveau;
}


/* =========================================================
   CALCUL ATTAQUE
========================================================= */

function calculerAttaque() {

    const quantites =
        getQuantites();

    let fdf = 0;


    /*
       FDF = somme des attaques
       de toutes les unités.
    */

    for (
        let i = 0;
        i < unites.length;
        i++
    ) {

        fdf +=
            quantites[i] *
            unites[i][1];

    }


    const bonus =
        Number(
            document.getElementById(
                "bonusAttaque"
            ).value
        ) || 0;


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    if (fdf <= 0) {

        document.getElementById(
            "resultat"
        ).innerHTML = "";

        return;
    }


    /*
       Recherche de la mandibule.
    */

    const niveau =
        trouverMandibule(
            fdf,
            bonus,
            alliance
        );


    /*
       La valeur affichée avant parenthèses
       est la FDF en attaque.

       Le bonus est affiché entre parenthèses.
    */

    document.getElementById(
        "resultat"
    ).innerHTML =
        "FDF : " +
        Math.round(fdf) +
        "(+" +
        Math.round(bonus) +
        ")" +
        "<br>" +
        "Mandibule : niveau " +
        niveau;
}


/* =========================================================
   CALCUL DÉFENSE
========================================================= */

function calculerDefense() {

    const quantites =
        getQuantites();


    let mortsRestants =
        Number(
            document.getElementById(
                "unitesTues"
            ).value
        ) || 0;


    let defenseVivante = 0;
    let defenseMorte = 0;


    /*
       Les unités sont tuées dans l'ordre
       du tableau.
    */

    for (
        let i = 0;
        i < unites.length;
        i++
    ) {

        const quantite =
            quantites[i];

        const defense =
            unites[i][2];


        const tuees =
            Math.min(
                quantite,
                mortsRestants
            );


        const vivantes =
            quantite - tuees;


        defenseVivante +=
            vivantes * defense;


        defenseMorte +=
            tuees * defense;


        mortsRestants -=
            tuees;
    }


    /*
       Les unités mortes comptent pour 1/10
       de leur défense.
    */

    const defenseDesMorts =
        defenseMorte * 0.10;


    /*
       Défense avant bonus.
    */

    const defenseBase =
        defenseVivante +
        defenseDesMorts;


    const bonus =
        Number(
            document.getElementById(
                "bonusDefense"
            ).value
        ) || 0;


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    if (defenseBase <= 0) {

        document.getElementById(
            "resultat"
        ).innerHTML = "";

        return;
    }


    /*
       Recherche de la mandibule.
    */

    const niveau =
        trouverMandibule(
            defenseBase,
            bonus,
            alliance
        );


    /*
       En défense, on affiche la défense
       calculée avant mandibule sous la forme
       base(+bonus).
    */

    document.getElementById(
        "resultat"
    ).innerHTML =
        "FDF : " +
        Math.round(defenseBase) +
        "(+" +
        Math.round(bonus) +
        ")" +
        "<br>" +
        "Mandibule : niveau " +
        niveau;
}


/* =========================================================
   FIN
========================================================= */

</script>

</body>
   </html>
