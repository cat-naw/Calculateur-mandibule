<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de mandibule</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        background: #e8d2a8;
        color: #3b2818;
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
        color: #5a321c;
        margin-bottom: 25px;
    }

    .container {
        display: flex;
        gap: 30px;
        max-width: 900px;
        margin: auto;
        align-items: flex-start;
    }

    .units {
        flex: 1;
    }

    .unit-table {
        width: 100%;
        border-collapse: collapse;
        background: #f3dfb9;
        border: 2px solid #9b7046;
    }

    .unit-table th,
    .unit-table td {
        border: 1px solid #9b7046;
        padding: 8px;
        text-align: center;
    }

    .unit-table th {
        color: #5a321c;
    }

    .unit-table input {
        width: 100%;
        padding: 6px;
        border: 1px solid #9b7046;
        background: #fff8e8;
        color: #3b2818;
        border-radius: 4px;
    }

    .side {
        width: 280px;
    }

    .mode {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .mode label {
        cursor: pointer;
    }

    .mode input {
        width: auto;
    }

    .field {
        margin-bottom: 15px;
    }

    .field label {
        display: block;
        margin-bottom: 5px;
        color: #5a321c;
    }

    .field input {
        width: 100%;
        padding: 8px;
        border: 1px solid #9b7046;
        background: #fff8e8;
        color: #3b2818;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 9px;
        border: 1px solid #9b7046;
        border-radius: 4px;
        background: #f3dfb9;
        color: #3b2818;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #dcc397;
    }

    #resultat {
        margin-top: 20px;
        line-height: 1.7;
    }

    @media (max-width: 700px) {
        .container {
            flex-direction: column;
        }

        .side {
            width: 100%;
        }
    }
</style>
</head>

<body>

<h1>Calculateur de mandibule</h1>

<div class="container">

    <!-- TABLEAU DES UNITÉS -->
    <div class="units">

        <table class="unit-table">

            <thead>
                <tr>
                    <th>Unité</th>
                    <th>Nombre</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Esclave</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Maître esclave</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune soldate</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Soldate</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Soldate d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Gardienne</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Gardienne d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tirailleuse</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tirailleuse d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune légionnaire</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Légionnaire</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Légionnaire d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune tank</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tank</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tank d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

            </tbody>
        </table>

    </div>


    <!-- PARTIE CALCUL -->
    <div class="side">

        <div class="mode">

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="attaque"
                    checked
                    onchange="changerMode()">
                Attaque
            </label>

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="defense"
                    onchange="changerMode()">
                Défense
            </label>

        </div>


        <!-- ATTAQUE -->

        <div id="attaqueFields">

            <div class="field">

                <label>Bonus d'attaque</label>

                <input
                    type="number"
                    id="bonusAttaque"
                    value="0"
                    step="any">

            </div>

            <button onclick="calculerAttaque()">
                Calculer
            </button>

        </div>


        <!-- DÉFENSE -->

        <div id="defenseFields" style="display:none;">

            <div class="field">

                <label>Unités tuées</label>

                <input
                    type="number"
                    id="unitesTues"
                    value="0"
                    min="0"
                    step="1">

            </div>

            <div class="field">

                <label>Bonus de défense</label>

                <input
                    type="number"
                    id="bonusDefense"
                    value="0"
                    step="any">

            </div>

            <button onclick="calculerDefense()">
                Calculer
            </button>

        </div>


        <div id="resultat"></div>

    </div>

</div>


<script>

/*
===========================================================
STATS DES UNITÉS
===========================================================

Ordre :
1. Esclave
2. Maître esclave
3. Jeune soldate
4. Soldate
5. Soldate d'élite
6. Gardienne
7. Gardienne d'élite
8. Tirailleuse
9. Tirailleuse d'élite
10. Jeune légionnaire
11. Légionnaire
12. Légionnaire d'élite
13. Jeune tank
14. Tank
15. Tank d'élite

Chaque ligne contient :
[attaque, défense]
*/

const stats = [
    [3, 3],
    [6, 4],
    [8, 7],
    [11, 10],
    [17, 14],
    [1, 27],
    [1, 35],
    [32, 10],
    [40, 12],
    [45, 35],
    [60, 45],
    [65, 50],
    [80, 1],
    [140, 1],
    [160, 1]
];


/*
===========================================================
RÉCUPÉRATION DES QUANTITÉS
===========================================================
*/

function getQuantites() {

    const inputs =
        document.querySelectorAll(
            ".unit-table tbody input"
        );

    return Array.from(inputs).map(
        input => Number(input.value) || 0
    );
}


/*
===========================================================
CHANGEMENT ATTAQUE / DÉFENSE
===========================================================
*/

function changerMode() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;

    document.getElementById(
        "attaqueFields"
    ).style.display =
        mode === "attaque" ? "block" : "none";

    document.getElementById(
        "defenseFields"
    ).style.display =
        mode === "defense" ? "block" : "none";

    document.getElementById(
        "resultat"
    ).innerHTML = "";
}


/*
===========================================================
ATTAQUE
===========================================================

FDF = somme des attaques.

Attaque avec mandibule :

FDF × 1.05^niveau
===========================================================
*/

function calculerAttaque() {

    const quantites = getQuantites();

    let fdf = 0;

    for (let i = 0; i < stats.length; i++) {

        fdf +=
            quantites[i] *
            stats[i][0];
    }


    /*
       Le bonus d'attaque entré correspond
       à l'attaque observée.
    */

    const attaqueObservee =
        Number(
            document.getElementById(
                "bonusAttaque"
            ).value
        );


    let niveau = null;


    if (fdf > 0 && attaqueObservee > 0) {

        const ratio =
            attaqueObservee / fdf;

        const niveauExact =
            Math.log(ratio) /
            Math.log(1.05);

        const niveauArrondi =
            Math.round(niveauExact);

        /*
           Vérification avec le coefficient
           exact du niveau trouvé.
        */

        const coefficient =
            Math.pow(1.05, niveauArrondi);

        const attaqueCalculee =
            fdf * coefficient;


        /*
           Tolérance de 0,5 % pour les éventuels
           arrondis du jeu.
        */

        const erreur =
            Math.abs(
                attaqueCalculee -
                attaqueObservee
            ) / attaqueObservee;


        if (erreur <= 0.005) {
            niveau = niveauArrondi;
        }
    }


    let resultat =
        "<strong>FDF :</strong> " +
        formatNombre(fdf);


    if (niveau !== null) {

        resultat +=
            "<br><strong>Mandibule :</strong> niveau " +
            niveau;

    } else {

        resultat +=
            "<br><strong>Mandibule :</strong> " +
            "impossible à déterminer";
    }


    document.getElementById(
        "resultat"
    ).innerHTML = resultat;
}


/*
===========================================================
DÉFENSE
===========================================================

Les unités sont tuées dans l'ordre du tableau.

Défense avant mandibule :

défense des vivantes
+
10 % de la défense des mortes

Puis :

défense finale =
défense avant mandibule × 1.05^niveau
===========================================================
*/

function calculerDefense() {

    const quantites = getQuantites();

    let mortsRestants =
        Number(
            document.getElementById(
                "unitesTues"
            ).value
        ) || 0;


    if (mortsRestants < 0) {
        mortsRestants = 0;
    }


    let defenseVivante = 0;
    let defenseMorte = 0;


    /*
       On parcourt les unités dans leur ordre
       de destruction.
    */

    for (let i = 0; i < stats.length; i++) {

        const quantite =
            quantites[i];

        const defense =
            stats[i][1];


        const tuees =
            Math.min(
                quantite,
                mortsRestants
            );


        const vivantes =
            quantite - tuees;


        defenseMorte +=
            tuees * defense;

        defenseVivante +=
            vivantes * defense;


        mortsRestants -=
            tuees;
    }


    /*
       Les morts comptent pour 1/10
    */

    const dixPourcentMorts =
        defenseMorte * 0.10;


    /*
       Défense avant mandibule
    */

    const defenseBase =
        defenseVivante +
        dixPourcentMorts;


    /*
       Bonus / défense observée
    */

    const defenseObservee =
        Number(
            document.getElementById(
                "bonusDefense"
            ).value
        );


    let niveau = null;


    if (
        defenseBase > 0 &&
        defenseObservee > 0
    ) {

        const ratio =
            defenseObservee /
            defenseBase;

        const niveauExact =
            Math.log(ratio) /
            Math.log(1.05);

        const niveauArrondi =
            Math.round(niveauExact);


        const coefficient =
            Math.pow(
                1.05,
                niveauArrondi
            );


        const defenseCalculee =
            defenseBase *
            coefficient;


        const erreur =
            Math.abs(
                defenseCalculee -
                defenseObservee
            ) / defenseObservee;


        if (erreur <= 0.005) {
            niveau = niveauArrondi;
        }
    }


    let resultat =
        "<strong>Défense :</strong> " +
        formatNombre(defenseBase);


    if (niveau !== null) {

        resultat +=
            "<br><strong>Défense avec mandibule :</strong> " +
            formatNombre(
                defenseBase *
                Math.pow(1.05, niveau)
            );

        resultat +=
            "<br><strong>Mandibule :</strong> niveau " +
            niveau;

    } else {

        resultat +=
            "<br><strong>Mandibule :</strong> " +
            "impossible à déterminer";
    }


    if (mortsRestants > 0) {

        resultat +=
            "<br><br>⚠️ Le nombre d'unités tuées " +
            "dépasse le nombre d'unités présentes.";
    }


    document.getElementById(
        "resultat"
    ).innerHTML = resultat;
}


/*
===========================================================
FORMAT DES NOMBRES
===========================================================
*/

function formatNombre(nombre) {

    return nombre.toLocaleString(
        "fr-FR",
        {
            maximumFractionDigits: 4
        }
    );
}

</script>

</body>
                   </html>
