<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de mandibule</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #e8d2a8;
        color: #3b2818;
    }

    h1 {
        text-align: center;
        font-size: 27px;
        margin: 0 0 25px 0;
        color: #5a321c;
        font-weight: bold;
    }

    .conteneur {
        display: flex;
        gap: 25px;
        max-width: 850px;
        margin: auto;
        align-items: flex-start;
    }

    /* TABLEAU DES UNITÉS */

    .tableau {
        flex: 1;
        border: 2px solid #9b7046;
        background: #f3dfb9;
        border-radius: 3px;
        overflow: hidden;
    }

    .ligne {
        display: grid;
        grid-template-columns: 1fr 100px;
        border-bottom: 1px solid #c6a77b;
        min-height: 42px;
        align-items: center;
    }

    .ligne:last-child {
        border-bottom: none;
    }

    .ligne:nth-child(odd) {
        background: #ead2a7;
    }

    .ligne:nth-child(even) {
        background: #f4e2c1;
    }

    .nom-unite {
        padding: 7px 10px;
        font-size: 15px;
    }

    .quantite {
        width: 90px;
        height: 32px;
        margin: auto;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    /* PARTIE DROITE */

    .droite {
        width: 245px;
    }

    .titre-section {
        font-size: 19px;
        font-weight: bold;
        margin-bottom: 10px;
        color: #5a321c;
    }

    .champ {
        margin-bottom: 18px;
    }

    .label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 6px;
        color: #5a321c;
    }

    select,
    .champ input[type="number"] {
        width: 100%;
        height: 40px;
        padding: 5px 8px;
        text-align: center;
        font-size: 16px;
        border: 1px solid #b99a6c;
        border-radius: 4px;
        background: #fffaf0;
        color: #3b2818;
    }

    /* ATTAQUE / DÉFENSE */

    .mode {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .mode label {
        font-size: 16px;
        font-weight: bold;
        color: #5a321c;
    }

    .mode input {
        margin-right: 5px;
    }

    /* BOUTON */

    .bouton {
        width: 100%;
        height: 45px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        border: 1px solid #315d32;
        border-radius: 4px;
        background: #4f8a52;
        color: white;
    }

    .bouton:hover {
        background: #417544;
    }

    /* RÉSULTAT */

    #resultat {
        margin-top: 20px;
        font-size: 19px;
        line-height: 1.6;
        font-weight: bold;
        color: #5a321c;
    }

    @media (max-width: 650px) {

        body {
            padding: 12px;
        }

        .conteneur {
            gap: 12px;
        }

        .droite {
            width: 180px;
        }

        .ligne {
            grid-template-columns: 1fr 70px;
        }

        .quantite {
            width: 62px;
        }

        .nom-unite {
            font-size: 14px;
        }

        .mode label {
            font-size: 14px;
        }

        select,
        .champ input[type="number"] {
            font-size: 14px;
        }
    }
</style>
</head>

<body>

<h1>Calculateur de mandibule</h1>

<div class="conteneur">

    <!-- TABLEAU DES UNITÉS -->

    <div class="tableau" id="tableauUnites"></div>


    <!-- PARTIE DROITE -->

    <div class="droite">

        <!-- TYPE D'ALLIANCE -->

        <div class="titre-section">Type d'alliance</div>

        <div class="champ">

            <select id="alliance">

                <option value="1.10">
                    Alliance guerrier (+10 %)
                </option>

                <option value="1.05">
                    Neutre (+5 %)
                </option>

                <option value="1">
                    Autre (aucun bonus)
                </option>

            </select>

        </div>


        <!-- ATTAQUE / DÉFENSE -->

        <div class="titre-section">Type de combat</div>

        <div class="mode">

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="attaque"
                    checked
                    onchange="changerMode()">
                Attaque
            </label>

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="defense"
                    onchange="changerMode()">
                Défense
            </label>

        </div>


        <!-- ATTAQUE -->

        <div id="attaqueFields">

            <div class="champ">

                <div class="label">
                    Bonus d'attaque
                </div>

                <input
                    id="bonusAttaque"
                    type="number"
                    min="0"
                    step="any"
                    value="0">

            </div>

        </div>


        <!-- DÉFENSE -->

        <div
            id="defenseFields"
            style="display:none;">

            <div class="champ">

                <div class="label">
                    Unités tuées
                </div>

                <input
                    id="unitesTues"
                    type="number"
                    min="0"
                    step="1"
                    value="0">

            </div>

            <div class="champ">

                <div class="label">
                    Bonus de défense
                </div>

                <input
                    id="bonusDefense"
                    type="number"
                    min="0"
                    step="any"
                    value="0">

            </div>

        </div>


        <!-- BOUTON -->

        <button class="bouton" onclick="calculer()">
            Calculer
        </button>


        <!-- RÉSULTAT -->

        <div id="resultat"></div>

    </div>

</div>


<script>

/* =========================================================
   UNITÉS

   [Nom, Attaque, Défense]

   L'ordre est l'ordre dans lequel les unités
   sont tuées.
   ========================================================= */

const unites = [

    ["Esclave", 3, 3],
    ["Maître esclave", 6, 4],
    ["Jeune soldate", 8, 7],
    ["Soldate", 11, 10],
    ["Soldate d'élite", 17, 14],
    ["Gardienne", 1, 27],
    ["Gardienne d'élite", 1, 35],
    ["Tirailleuse", 32, 10],
    ["Tirailleuse d'élite", 40, 12],
    ["Jeune légionnaire", 45, 35],
    ["Légionnaire", 60, 45],
    ["Légionnaire d'élite", 65, 50],
    ["Jeune tank", 80, 1],
    ["Tank", 140, 1],
    ["Tank d'élite", 160, 1]

];


/* =========================================================
   CRÉATION DU TABLEAU
   ========================================================= */

const tableau =
    document.getElementById("tableauUnites");


unites.forEach((unite, index) => {

    const ligne =
        document.createElement("div");

    ligne.className = "ligne";


    const nom =
        document.createElement("div");

    nom.className = "nom-unite";
    nom.textContent = unite[0];


    const input =
        document.createElement("input");

    input.className = "quantite";
    input.type = "number";
    input.min = "0";
    input.step = "1";
    input.value = "0";
    input.id = "unite-" + index;


    ligne.appendChild(nom);
    ligne.appendChild(input);

    tableau.appendChild(ligne);

});


/* =========================================================
   CHANGEMENT ATTAQUE / DÉFENSE
   ========================================================= */

function changerMode() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;


    document.getElementById(
        "attaqueFields"
    ).style.display =
        mode === "attaque"
        ? "block"
        : "none";


    document.getElementById(
        "defenseFields"
    ).style.display =
        mode === "defense"
        ? "block"
        : "none";


    document.getElementById(
        "resultat"
    ).innerHTML = "";

}


/* =========================================================
   RÉCUPÉRATION DES QUANTITÉS
   ========================================================= */

function getQuantites() {

    return unites.map((unite, index) => {

        return Number(
            document.getElementById(
                "unite-" + index
            ).value
        ) || 0;

    });

}


/* =========================================================
   CALCUL PRINCIPAL
   ========================================================= */

function calculer() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;


    if (mode === "attaque") {

        calculerAttaque();

    } else {

        calculerDefense();

    }

}


/* =========================================================
   CALCUL ATTAQUE
   =========================================================

   FDF = somme des attaques des unités.

   Bonus d'attaque = bonus ajouté à la FDF.

   Attaque totale :

   (FDF + bonus)
   × 1,05^mandibule
   × bonus d'alliance
   ========================================================= */

function calculerAttaque() {

    const quantites = getQuantites();


    let fdf = 0;


    for (let i = 0; i < unites.length; i++) {

        fdf +=
            quantites[i] *
            unites[i][1];

    }


    const bonus =
        Number(
            document.getElementById(
                "bonusAttaque"
            ).value
        ) || 0;


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    /*
       Valeur de l'attaque sans mandibule
       mais avec le bonus d'attaque.
    */

    const base =
        fdf + bonus;


    let meilleurNiveau = 0;
    let meilleureErreur = Infinity;


    /*
       Recherche du niveau de mandibule.

       On teste les niveaux entiers.
    */

    for (let niveau = 0; niveau <= 250; niveau++) {

        const attaque =
            base *
            Math.pow(1.05, niveau) *
            alliance;


        /*
           Pour l'instant, le bonus est la valeur
           fournie directement. Le niveau donnant
           la valeur la plus cohérente est recherché.
        */

        const erreur =
            Math.abs(
                attaque -
                base
            );


        if (erreur < meilleureErreur) {

            meilleureErreur = erreur;
            meilleurNiveau = niveau;

        }

    }


    /*
       FDF affichée séparément.
    */

    let texte =
        "FDF : " +
        formatNombre(fdf);


    texte +=
        "<br>Mandibule : niveau " +
        meilleurNiveau;


    document.getElementById(
        "resultat"
    ).innerHTML = texte;

}


/* =========================================================
   CALCUL DÉFENSE
   =========================================================

   Les unités sont tuées dans l'ordre du tableau.

   Défense :

   défense des unités vivantes
   +
   10 % de la défense des unités mortes.

   Le bonus de défense s'applique également
   aux 10 % provenant des unités mortes.

   Défense :

   (défense vivante
   + défense morte × 10 %)
   + bonus de défense

   puis bonus de mandibule et d'alliance.
   ========================================================= */

function calculerDefense() {

    const quantites = getQuantites();


    let mortsRestants =
        Number(
            document.getElementById(
                "unitesTues"
            ).value
        ) || 0;


    let defenseVivante = 0;
    let defenseMorte = 0;


    /*
       Parcours dans l'ordre de destruction.
    */

    for (let i = 0; i < unites.length; i++) {

        const quantite =
            quantites[i];


        const defense =
            unites[i][2];


        const tuees =
            Math.min(
                quantite,
                mortsRestants
            );


        const vivantes =
            quantite - tuees;


        defenseVivante +=
            vivantes * defense;


        defenseMorte +=
            tuees * defense;


        mortsRestants -=
            tuees;

    }


    /*
       10 % de la défense des unités mortes.
    */

    const defenseDesMorts =
        defenseMorte * 0.10;


    /*
       Défense de base avant les bonus.
    */

    const defenseBase =
        defenseVivante +
        defenseDesMorts;


    const bonus =
        Number(
            document.getElementById(
                "bonusDefense"
            ).value
        ) || 0;


    /*
       Le bonus de défense s'applique
       également à la partie correspondant
       aux unités mortes.
    */

    const defenseAvecBonus =
        (defenseBase + bonus);


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    /*
       Recherche de la mandibule.
    */

    let meilleurNiveau = 0;
    let meilleureErreur = Infinity;


    /*
       Comme le bonus saisi est le bonus fourni
       par le combat, on recherche le niveau
       correspondant.
    */

    for (let niveau = 0; niveau <= 250; niveau++) {

        const defense =
            defenseAvecBonus *
            Math.pow(1.05, niveau) *
            alliance;


        const erreur =
            Math.abs(
                defense -
                defenseAvecBonus
            );


        if (erreur < meilleureErreur) {

            meilleureErreur = erreur;
            meilleurNiveau = niveau;

        }

    }


    let texte =
        "Défense de base : " +
        formatNombre(defenseBase);


    texte +=
        "<br>Mandibule : niveau " +
        meilleurNiveau;


    if (mortsRestants > 0) {

        texte +=
            "<br><br>⚠️ Nombre d'unités tuées supérieur " +
            "au nombre d'unités présentes.";

    }


    document.getElementById(
        "resultat"
    ).innerHTML = texte;

}


/* =========================================================
   FORMAT DES NOMBRES
   ========================================================= */

function formatNombre(nombre) {

    return nombre.toLocaleString(
        "fr-FR",
        {
            maximumFractionDigits: 4
        }
    );

}

</script>

</body>
</html>
