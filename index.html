<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculateur de mandibule</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #e8d2a8;
    color: #3b2818;
    font-family: Arial, sans-serif;
}

/* =========================
   TITRE
========================= */

h1 {
    text-align: center;
    color: #5a321c;
    margin: 0 0 25px 0;
}


/* =========================
   STRUCTURE PRINCIPALE
========================= */

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    max-width: 1000px;
    margin: 0 auto;
    align-items: start;
}


/* =========================
   TABLEAU DES UNITÉS
========================= */

.units {
    width: 100%;
}

.unit-table {
    width: 100%;
    border-collapse: collapse;
    background: #f3dfb9;
    border: 2px solid #9b7046;
}

.unit-table th,
.unit-table td {
    border: 1px solid #9b7046;
    padding: 8px;
    text-align: center;
}

.unit-table th {
    color: #5a321c;
    font-weight: bold;
}

.unit-table td:first-child {
    text-align: left;
}

.unit-table input {
    width: 100%;
    padding: 7px;
    border: 1px solid #9b7046;
    border-radius: 4px;
    background: #fff8e8;
    color: #3b2818;
    text-align: center;
}


/* =========================
   COLONNE DE DROITE
========================= */

.parameters {
    width: 100%;
}


/* =========================
   TYPE D'ALLIANCE
========================= */

.field {
    margin-bottom: 18px;
}

.field label {
    display: block;
    margin-bottom: 6px;
    color: #5a321c;
    font-weight: bold;
}

select,
.field input[type="number"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #9b7046;
    border-radius: 4px;
    background: #fff8e8;
    color: #3b2818;
}


/* =========================
   ATTAQUE / DÉFENSE
========================= */

.mode {
    display: flex;
    gap: 25px;
    margin-bottom: 20px;
}

.mode label {
    cursor: pointer;
    font-weight: bold;
}

.mode input {
    width: auto;
    margin-right: 5px;
}


/* =========================
   BOUTON
========================= */

button {
    width: 100%;
    padding: 10px;
    border: 1px solid #9b7046;
    border-radius: 4px;
    background: #f3dfb9;
    color: #3b2818;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
}

button:hover {
    background: #dcc397;
}


/* =========================
   RÉSULTATS
========================= */

#resultat {
    margin-top: 22px;
    line-height: 1.8;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .container {
        grid-template-columns: 1fr;
        gap: 25px;
    }

    .parameters {
        width: 100%;
    }

    .unit-table th,
    .unit-table td {
        padding: 7px 5px;
    }

}

</style>
</head>


<body>

<h1>Calculateur de mandibule</h1>


<div class="container">


    <!-- =================================================
         GAUCHE : UNITÉS
    ================================================== -->

    <div class="units">

        <table class="unit-table">

            <thead>
                <tr>
                    <th>Unité</th>
                    <th>Nombre</th>
                </tr>
            </thead>

            <tbody>

                <tr>
                    <td>Esclave</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Maître esclave</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune soldate</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Soldate</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Soldate d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Gardienne</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Gardienne d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tirailleuse</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tirailleuse d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune légionnaire</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Légionnaire</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Légionnaire d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Jeune tank</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tank</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

                <tr>
                    <td>Tank d'élite</td>
                    <td><input type="number" min="0" value="0"></td>
                </tr>

            </tbody>

        </table>

    </div>


    <!-- =================================================
         DROITE : PARAMÈTRES + RÉSULTATS
    ================================================== -->

    <div class="parameters">


        <!-- ALLIANCE -->

        <div class="field">

            <label for="alliance">
                Type d'alliance
            </label>

            <select id="alliance">

                <option value="1.10">
                    Alliance guerrier (+10 %)
                </option>

                <option value="1.05">
                    Neutre (+5 %)
                </option>

                <option value="1">
                    Autre (aucun bonus)
                </option>

            </select>

        </div>


        <!-- ATTAQUE / DÉFENSE -->

        <div class="mode">

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="attaque"
                    checked
                    onchange="changerMode()">
                Attaque
            </label>

            <label>
                <input
                    type="radio"
                    name="mode"
                    value="defense"
                    onchange="changerMode()">
                Défense
            </label>

        </div>


        <!-- =========================
             ATTAQUE
        ========================== -->

        <div id="attaqueFields">

            <div class="field">

                <label for="bonusAttaque">
                    Attaque observée
                </label>

                <input
                    type="number"
                    id="bonusAttaque"
                    min="0"
                    step="any"
                    value="0">

            </div>

        </div>


        <!-- =========================
             DÉFENSE
        ========================== -->

        <div
            id="defenseFields"
            style="display:none;">

            <div class="field">

                <label for="unitesTues">
                    Unités tuées
                </label>

                <input
                    type="number"
                    id="unitesTues"
                    min="0"
                    step="1"
                    value="0">

            </div>


            <div class="field">

                <label for="bonusDefense">
                    Défense observée
                </label>

                <input
                    type="number"
                    id="bonusDefense"
                    min="0"
                    step="any"
                    value="0">

            </div>

        </div>


        <!-- BOUTON -->

        <button onclick="calculer()">
            Calculer
        </button>


        <!-- RÉSULTATS -->

        <div id="resultat"></div>

    </div>

</div>


<script>

/* =========================================================
   STATS DES UNITÉS

   [attaque, défense]

   L'ordre correspond également à l'ordre
   dans lequel les unités sont tuées.
========================================================= */

const stats = [

    [3, 3],       // Esclave
    [6, 4],       // Maître esclave
    [8, 7],       // Jeune soldate
    [11, 10],     // Soldate
    [17, 14],     // Soldate d'élite
    [1, 27],      // Gardienne
    [1, 35],      // Gardienne d'élite
    [32, 10],     // Tirailleuse
    [40, 12],     // Tirailleuse d'élite
    [45, 35],     // Jeune légionnaire
    [60, 45],     // Légionnaire
    [65, 50],     // Légionnaire d'élite
    [80, 1],      // Jeune tank
    [140, 1],     // Tank
    [160, 1]      // Tank d'élite

];


/* =========================================================
   RÉCUPÉRER LES QUANTITÉS
========================================================= */

function getQuantites() {

    const inputs =
        document.querySelectorAll(
            ".unit-table tbody input"
        );

    return Array.from(inputs).map(
        input => Number(input.value) || 0
    );
}


/* =========================================================
   CHANGEMENT ATTAQUE / DÉFENSE
========================================================= */

function changerMode() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;


    document.getElementById(
        "attaqueFields"
    ).style.display =
        mode === "attaque"
        ? "block"
        : "none";


    document.getElementById(
        "defenseFields"
    ).style.display =
        mode === "defense"
        ? "block"
        : "none";


    document.getElementById(
        "resultat"
    ).innerHTML = "";
}


/* =========================================================
   CALCUL PRINCIPAL
========================================================= */

function calculer() {

    const mode =
        document.querySelector(
            'input[name="mode"]:checked'
        ).value;


    if (mode === "attaque") {

        calculerAttaque();

    } else {

        calculerDefense();

    }

}


/* =========================================================
   ATTAQUE
=========================================================

   FDF = somme des attaques

   Attaque observée =
   FDF × 1.05^mandibule × bonus alliance
========================================================= */

function calculerAttaque() {

    const quantites = getQuantites();

    let fdf = 0;


    for (let i = 0; i < stats.length; i++) {

        fdf +=
            quantites[i] *
            stats[i][0];

    }


    const attaqueObservee =
        Number(
            document.getElementById(
                "bonusAttaque"
            ).value
        );


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    let niveau = null;

    let meilleureErreur = Infinity;


    if (
        fdf > 0 &&
        attaqueObservee > 0
    ) {

        /*
           Recherche du niveau donnant
           la valeur la plus proche.

           On teste jusqu'au niveau 200.
        */

        for (let n = 0; n <= 200; n++) {

            const valeur =
                fdf *
                Math.pow(1.05, n) *
                alliance;


            const erreur =
                Math.abs(
                    valeur -
                    attaqueObservee
                );


            if (erreur < meilleureErreur) {

                meilleureErreur = erreur;
                niveau = n;

            }

        }

    }


    let resultat =
        "<strong>FDF :</strong> " +
        formatNombre(fdf);


    if (niveau !== null) {

        const attaqueCalculee =
            fdf *
            Math.pow(1.05, niveau) *
            alliance;


        resultat +=
            "<br><strong>Mandibule :</strong> niveau " +
            niveau;


        resultat +=
            "<br><strong>Attaque calculée :</strong> " +
            formatNombre(attaqueCalculee);

    }


    document.getElementById(
        "resultat"
    ).innerHTML = resultat;
}


/* =========================================================
   DÉFENSE
=========================================================

   Les unités sont tuées dans l'ordre du tableau.

   Défense de base :

   défense des unités vivantes
   +
   10 % de la défense des unités mortes

   Puis :

   Défense finale =
   défense de base
   × 1.05^mandibule
   × bonus alliance
========================================================= */

function calculerDefense() {

    const quantites = getQuantites();


    let mortsRestants =
        Number(
            document.getElementById(
                "unitesTues"
            ).value
        ) || 0;


    if (mortsRestants < 0) {
        mortsRestants = 0;
    }


    let defenseVivante = 0;

    let defenseMorte = 0;


    /*
       Parcours dans l'ordre exact
       de destruction.
    */

    for (let i = 0; i < stats.length; i++) {

        const quantite =
            quantites[i];


        const defense =
            stats[i][1];


        const tuees =
            Math.min(
                quantite,
                mortsRestants
            );


        const vivantes =
            quantite - tuees;


        defenseMorte +=
            tuees * defense;


        defenseVivante +=
            vivantes * defense;


        mortsRestants -=
            tuees;

    }


    /*
       Les morts comptent pour 10 %.
    */

    const dixPourcentMorts =
        defenseMorte * 0.10;


    /*
       Défense avant les bonus.
    */

    const defenseBase =
        defenseVivante +
        dixPourcentMorts;


    const defenseObservee =
        Number(
            document.getElementById(
                "bonusDefense"
            ).value
        );


    const alliance =
        Number(
            document.getElementById(
                "alliance"
            ).value
        );


    let niveau = null;

    let meilleureErreur = Infinity;


    /*
       Recherche du niveau de mandibule.
    */

    if (
        defenseBase > 0 &&
        defenseObservee > 0
    ) {

        for (let n = 0; n <= 200; n++) {

            const valeur =
                defenseBase *
                Math.pow(1.05, n) *
                alliance;


            const erreur =
                Math.abs(
                    valeur -
                    defenseObservee
                );


            if (erreur < meilleureErreur) {

                meilleureErreur = erreur;
                niveau = n;

            }

        }

    }


    let resultat =
        "<strong>Défense de base :</strong> " +
        formatNombre(defenseBase);


    if (niveau !== null) {

        const defenseCalculee =
            defenseBase *
            Math.pow(1.05, niveau) *
            alliance;


        resultat +=
            "<br><strong>Mandibule :</strong> niveau " +
            niveau;


        resultat +=
            "<br><strong>Défense calculée :</strong> " +
            formatNombre(defenseCalculee);

    }


    if (mortsRestants > 0) {

        resultat +=
            "<br><br>⚠️ Le nombre d'unités tuées " +
            "dépasse le nombre d'unités présentes.";

    }


    document.getElementById(
        "resultat"
    ).innerHTML = resultat;
}


/* =========================================================
   FORMAT DES NOMBRES
========================================================= */

function formatNombre(nombre) {

    return nombre.toLocaleString(
        "fr-FR",
        {
            maximumFractionDigits: 4
        }
    );

}

</script>

</body>
</html>
